name: Deploy to DreamHost

on:
  push:
    branches: [main]
    paths:
      - "wp-content/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-dreamhost
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DH_HOST: ${{ secrets.DH_HOST }}
      DH_USER: ${{ secrets.DH_USER }}
      DH_SITE_DIR: ${{ secrets.DH_SITE_DIR }}
      DH_SSH_KEY: ${{ secrets.DH_SSH_KEY }}
    steps:
      - name: Check DreamHost secrets
        id: secrets
        run: |
          missing=""
          for s in DH_HOST DH_USER DH_SITE_DIR DH_SSH_KEY; do
            [ -z "${!s}" ] && missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Skipping deploy. Missing secrets:$missing (see README)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - name: Lint PHP
        if: steps.secrets.outputs.ready == 'true'
        run: find wp-content -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Set up SSH
        if: steps.secrets.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DH_SSH_KEY" | tr -d '\r' | sed '/./,$!d' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Check the site folder
        if: steps.secrets.outputs.ready == 'true'
        run: |
          # Trim stray spaces or a trailing slash from the folder secret.
          DIR="$(printf '%s' "$DH_SITE_DIR" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#/*$##')"
          echo "DIR=$DIR" >> "$GITHUB_ENV"

          if ! head -1 ~/.ssh/deploy_key | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then
            echo "::error::DH_SSH_KEY doesn't look like a private key. Copy it with: pbcopy < ~/.ssh/vinhetas_deploy (not the .pub file)."
            exit 1
          fi

          if ! ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 "$DH_USER@$DH_HOST" "echo connected" ; then
            echo "::error::SSH login failed for $DH_USER@$DH_HOST. Check DH_USER, DH_HOST and DH_SSH_KEY."
            exit 1
          fi

          if ! ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$DH_USER@$DH_HOST" "test -d '$DIR'"; then
            echo "::error::Logged in, but the folder in DH_SITE_DIR doesn't exist on the server."
            exit 1
          fi

          if ! ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$DH_USER@$DH_HOST" "test -d '$DIR/wp-content'"; then
            echo "::error::Logged in and found the folder, but there is no WordPress (wp-content) in it. Check DH_SITE_DIR."
            exit 1
          fi
          echo "Site folder OK"

      - name: Copy theme and plugin
        if: steps.secrets.outputs.ready == 'true'
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key"
          rsync -az --delete -e "$SSH" \
            wp-content/themes/vinhetas/ "$DH_USER@$DH_HOST:$DIR/wp-content/themes/vinhetas/"
          rsync -az --delete -e "$SSH" \
            wp-content/plugins/vinhetas-enquiries/ "$DH_USER@$DH_HOST:$DIR/wp-content/plugins/vinhetas-enquiries/"

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
